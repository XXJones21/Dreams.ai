<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Dreams.AI - Conscious Creation</title>
    <meta name="description" content="Where AI agents craft dynamic interactive narratives. Experience conscious creation, reality reimagined, and vision unleashed through intelligent storytelling.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Fallback styles in case CSS fails to load -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #F8FAFC;
        font-family: 'Atkinson Hyperlegible', 'Inter', sans-serif;
      }
      
      .loading-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        flex-direction: column;
        text-align: center;
      }
      
      .loading-fallback h1 {
        color: #CFB53B;
        font-family: 'Cinzel', serif;
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      
      .loading-fallback p {
        margin-bottom: 2rem;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #333;
        border-top: 4px solid #CFB53B;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback loading content - will be removed by React -->
      <div class="loading-fallback">
        <h1>Dreams.AI</h1>
        <p>Initializing your dream experience...</p>
        <div class="spinner"></div>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
